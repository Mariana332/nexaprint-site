<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importar Atual Card — NEXA PRINT</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><style>.import-page{max-width:1100px;margin:40px auto}.import-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.import-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.import-summary>div{padding:18px;border:1px solid #d9e3e1;border-radius:14px;background:#fff}.import-summary strong{display:block;font-size:25px;color:#0b6f68}.import-summary span{display:block;margin-top:4px;color:#667; font-size:13px}.note.danger{border-left:4px solid #b42318}.note.success{border-left:4px solid #087f5b}.import-table{margin-top:18px;max-height:420px;overflow:auto}.upload-zone{border:2px dashed #b9cfcc;border-radius:16px;padding:28px;text-align:center;background:#f7faf9}.drop-label{display:grid;gap:7px;cursor:pointer}.drop-label strong{font-size:18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:760px){.import-summary{grid-template-columns:repeat(2,1fr)}.import-head{display:block}}</style></head><body><main class="container import-page"><div class="import-head"><div><span class="eyebrow">ATUALIZAÇÃO DO CATÁLOGO</span><h1>Importar lista da Atual Card</h1><p class="muted">Atualize custos, quantidades, variações e prazos sem mexer nos preços de venda da NEXA.</p></div><a class="btn" href="admin.html#dashboard">Voltar ao painel</a></div><section class="panel"><div class="note"><strong>Como funciona:</strong> selecione a nova planilha. Primeiro ela é lida e validada. Só depois você confirma a importação.</div><div class="upload-zone"><label class="drop-label" for="importFile"><strong>Selecionar planilha</strong><span class="muted">Excel (.xlsx) ou CSV</span><span id="importFileName" class="hint">Nenhum arquivo selecionado</span></label><input id="importFile" type="file" accept=".xlsx,.csv" hidden></div><div id="importPreview" class="preview-box"></div><div class="actions"><button id="prepareImport" class="btn primary" disabled>Preparar importação</button><button id="clearImport" class="btn">Limpar</button></div><div id="adminMessage" class="message"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script src="config.js"></script><script>const supabaseClient=createClient(window.NEXA_CONFIG.SUPABASE_URL,window.NEXA_CONFIG.SUPABASE_KEY);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function flash(t,ok=true){const e=document.querySelector('#adminMessage');if(e){e.textContent=t;e.style.color=ok?'#087f5b':'#b42318'}}function stats(){}function products(){}</script><script src="admin-import.js"></script></body></html>
