<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto — NEXA PRINT</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .product-page{padding:34px 0}.crumb{font-size:13px;color:var(--muted);margin-bottom:16px}.detail{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr);gap:24px}.panel{border:1px solid var(--line);border-radius:16px;background:#fff;padding:24px}.panel h1{margin:0;color:var(--ink);font-size:30px;line-height:1.12}.divider{height:1px;background:var(--line);margin:22px 0}.field-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:#5d6b82;margin-bottom:7px}.field select,.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;font:inherit;color:var(--text)}.quantity-list{display:grid;gap:9px}.qty{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}.qty.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}.qty-left{display:flex;gap:9px;align-items:center;font-weight:750;color:var(--ink)}.qty input{accent-color:var(--primary)}.qty-price{color:var(--primary-dark);font-weight:850}.templates{background:#f9fbfc;border:1px solid var(--line);border-radius:14px;padding:16px}.template-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.template-link{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;display:flex;justify-content:space-between;gap:10px}.template-link strong{font-size:13px;color:var(--ink)}.template-link span{font-size:11px;color:var(--primary-dark);font-weight:800}.upload{border:1.5px dashed #b9c7d5;border-radius:12px;padding:24px;text-align:center;color:var(--muted)}.buy-card{position:sticky;top:92px}.preview{height:250px;border:1px solid var(--line);border-radius:14px;background:#f6f8f9;display:grid;place-items:center;overflow:hidden;margin-bottom:18px}.preview img{width:100%;height:100%;object-fit:contain}.total{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.total small{display:block;color:var(--muted);font-size:12px}.total strong{font-size:36px;color:var(--primary-dark);display:block;margin-top:2px}.buy-actions{display:grid;gap:10px;margin-top:18px}.buy-actions .btn{width:100%}
    @media(max-width:900px){.detail{grid-template-columns:1fr}.buy-card{position:static}.field-grid,.template-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="topbar"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">N</span><span><strong>NEXA</strong> <b>PRINT</b><small>GRÁFICA PROFISSIONAL</small></span></a><div class="search-wrap"><input id="globalSearch" placeholder="O que você procura?"></div><nav class="nav-actions"><a href="index.html">Início</a><a href="admin.html">Acesso restrito</a></nav></div></header>
<main class="product-page"><div class="container"><div class="crumb"><a href="index.html">Início</a> / Produto</div><div id="status" class="empty-state">Carregando produto...</div><div id="detail" class="detail hidden"></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="produto.js"></script>
</body></html>
